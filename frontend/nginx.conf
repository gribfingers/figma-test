server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxies to the "backend" service on the same docker-compose network.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite's build output content-hashes every JS/CSS filename, so these are
    # safe to cache aggressively — a new deploy always gets new filenames.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references those hashed filenames, so it must never be
    # served stale — otherwise a browser/proxy that cached an old
    # index.html keeps loading a previous deploy's JS bundle indefinitely.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
